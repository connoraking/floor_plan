name: Test and build desktop downloads

permissions:
  contents: read

concurrency:
  group: floor-planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Require the tag to match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$app_version"

      - name: Run app tests
        run: npm test

      - name: Build the renderer
        run: npm run build

      - name: Check dependencies
        run: npm audit

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify the Windows installer exists
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/Floor-Planner-Setup-$version.exe"
          if (-not (Test-Path $installer)) { throw "Missing Windows installer: $installer" }

      - uses: actions/upload-artifact@v7
        with:
          name: Floor-Planner-Windows
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build universal macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Verify the macOS download exists
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "release/Floor-Planner-$version-universal.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: Floor-Planner-macOS
          path: release/*.dmg
          if-no-files-found: error

  build-linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Linux packaging dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - name: Install exact dependencies
        run: npm ci

      - name: Build Linux AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:linux

      - name: Verify the Linux download exists
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "release/Floor-Planner-$version-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: Floor-Planner-Linux
          path: release/*.AppImage
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"

  publish-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Floor-Planner-Windows
          path: release-assets

      - name: Attach Windows files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Floor-Planner-macOS
          path: release-assets

      - name: Attach macOS files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Floor-Planner-Linux
          path: release-assets

      - name: Attach Linux files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
