name: Test and build desktop downloads

permissions:
  contents: read

concurrency:
  group: floor-planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Require the tag to match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p \"require('./package.json').version\")"

      - name: Run app tests
        run: npm test

      - name: Build the renderer
        run: npm run build

      - name: Check dependencies
        run: npm audit

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            command: npm run dist:win
            artifact: Floor-Planner-Windows
            files: release/*.exe
          - os: macos-15
            command: npm run dist:mac
            artifact: Floor-Planner-macOS
            files: release/*.dmg
          - os: ubuntu-24.04
            command: npm run dist:linux
            artifact: Floor-Planner-Linux
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Exercise PDF, calibration, and furniture in Electron
        if: runner.os == 'Windows'
        run: npm run test:electron

      - name: Build downloadable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}

      - name: Verify both Windows downloads exist
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = @(
            "release/Floor-Planner-Setup-$version.exe",
            "release/Floor-Planner-Portable-$version.exe"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "Missing Windows download: $file" }
          }

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && always()
        with:
          name: Smoke-Test-Screenshot
          path: tmp/electron-smoke.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Floor-Planner-*
          path: release-assets
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
          fi
