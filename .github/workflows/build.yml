name: Test and build Windows downloads

permissions:
  contents: read

concurrency:
  group: floor-planner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Require the tag to match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$app_version"

      - name: Run app tests
        run: npm test

      - name: Build the renderer
        run: npm run build

      - name: Check dependencies
        run: npm audit

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build installer and portable app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify both Windows downloads exist
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = @(
            "release/Floor-Planner-Setup-$version.exe",
            "release/Floor-Planner-Portable-$version.exe"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "Missing Windows download: $file" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: Floor-Planner-Windows
          path: release/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Floor-Planner-Windows
          path: release-assets

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
          fi
