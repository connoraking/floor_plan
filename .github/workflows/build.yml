name: Build desktop apps

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app
        run: python -m pip install .

      - name: Run model and headless GUI tests
        run: python -m unittest discover -s tests -v

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: FloorPlanner-Windows-x64
            archive: FloorPlanner-Windows-x64.zip
          - os: macos-15
            artifact: FloorPlanner-macOS-arm64
            archive: FloorPlanner-macOS-arm64.zip
          - os: macos-15-intel
            artifact: FloorPlanner-macOS-x64
            archive: FloorPlanner-macOS-x64.zip
          - os: ubuntu-22.04
            artifact: FloorPlanner-Linux-x64
            archive: FloorPlanner-Linux-x64.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app and packager
        run: python -m pip install . pyinstaller==6.22.2

      - name: Run model tests
        run: python -m unittest discover -s tests -v

      - name: Build desktop package
        run: pyinstaller --noconfirm --clean packaging/FloorPlanner.spec

      - name: Smoke-test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/FloorPlanner/FloorPlanner.exe --smoke-test

      - name: Smoke-test macOS package
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/FloorPlanner.app/Contents/MacOS/FloorPlanner --smoke-test

      - name: Smoke-test Linux package
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/FloorPlanner/FloorPlanner --smoke-test

      - name: Stage Windows release with license notices
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse -Force dist/FloorPlanner package/FloorPlanner
          python scripts/collect_release_licenses.py package/FloorPlanner

      - name: Stage macOS release with license notices
        if: runner.os == 'macOS'
        run: |
          mkdir -p package/FloorPlanner
          ditto dist/FloorPlanner.app package/FloorPlanner/FloorPlanner.app
          python scripts/collect_release_licenses.py package/FloorPlanner

      - name: Stage Linux release with license notices
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cp -a dist/FloorPlanner package/FloorPlanner
          python scripts/collect_release_licenses.py package/FloorPlanner

      - name: Verify release notices
        run: >-
          python -c "from pathlib import Path;
          root=Path('package/FloorPlanner');
          required=('LICENSE.txt','THIRD_PARTY_NOTICES.md','BUNDLED_VERSIONS.txt','third_party_licenses/LGPL-3.0.txt','third_party_licenses/ICU-LICENSE.txt','third_party_licenses/UNICODE-LICENSE.txt');
          missing=[name for name in required if not (root/name).is_file()];
          assert not missing, missing"

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/FloorPlanner -DestinationPath '${{ matrix.archive }}'

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent package/FloorPlanner '${{ matrix.archive }}'

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: tar -C package -czf '${{ matrix.archive }}' FloorPlanner

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: FloorPlanner-*
          path: release-assets
          merge-multiple: true

      - name: Add exact Qt corresponding source
        env:
          QT_VERSION: "6.11.2"
        run: |
          curl --fail --location --retry 3 -o "release-assets/qtbase-v${QT_VERSION}-source.tar.gz" "https://github.com/qt/qtbase/archive/refs/tags/v${QT_VERSION}.tar.gz"
          curl --fail --location --retry 3 -o "release-assets/qtsvg-v${QT_VERSION}-source.tar.gz" "https://github.com/qt/qtsvg/archive/refs/tags/v${QT_VERSION}.tar.gz"
          curl --fail --location --retry 3 -o "release-assets/qtwayland-v${QT_VERSION}-source.tar.gz" "https://github.com/qt/qtwayland/archive/refs/tags/v${QT_VERSION}.tar.gz"
          curl --fail --location --retry 3 -o "release-assets/pyside-setup-v${QT_VERSION}-source.tar.gz" "https://github.com/pyside/pyside-setup/archive/refs/tags/v${QT_VERSION}.tar.gz"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
          fi
