[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "family-floor-planner"
version = "0.1.0"
description = "Place true-to-size furniture over a PDF floor plan"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Connor"}]
dependencies = [
    "PySide6-Essentials==6.11.2",
    "pypdfium2==5.13.0",
    "Pillow==12.3.0",
]

[project.gui-scripts]
floor-planner = "floor_planner.main_window:run"

[tool.setuptools.packages.find]
include = ["floor_planner*"]
